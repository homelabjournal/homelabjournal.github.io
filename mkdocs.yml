site_name: Home Lab Journal
site_description: My son and I build a home lab, one phase at a time.
site_url: https://homelabjournal.com/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Archivo
    code: DM Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.indexes
    - content.code.copy

plugins:
  - search
  - blog:
      blog_dir: .
      post_date_format: d MMMM yyyy
      post_url_format: "{slug}"
      archive_name: Archive
      categories_name: Topics
      draft_on_serve: true
      draft_if_future_date: true
  - tags
  - rss:
      match_path: "posts/.*"
      date_from_meta:
        as_creation: date
      categories:
        - categories
      comments_path: null
      use_git: false
      abstract_chars_count: 300
      feed_title: Home Lab Journal
      feed_description: My son and I build a home lab, one phase at a time.

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

extra_css:
  - stylesheets/extra.css

nav:
  - Blog: index.md
  - About: about.md

extra:
  # Cloudflare Web Analytics: the site token from Cloudflare (Web Analytics → the site →
  # Manage site). It's public by design (it appears in every page), so it can live here.
  # Leave it empty to switch the stats off.
  cloudflare_analytics_token: "6ce965d759334a58a625d6d4219bd517"
  social:
    - icon: material/rss
      link: /feed_rss_created.xml
      name: RSS feed

